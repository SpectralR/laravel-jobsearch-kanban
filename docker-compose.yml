x-php-cli: &php-cli
  image: serversideup/php:8.4-cli
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

x-php: &php
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  environment: &php-env
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-crm}
    DB_USERNAME: ${DB_USERNAME:-crm}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database

services:
  app:
    <<: *php
    image: mini-crm-app
    build:
      context: ./docker/php
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    ports:
      - "${APP_PORT:-8085}:8080"
    environment:
      <<: *php-env
      PHP_OPCACHE_ENABLE: 0
      AUTORUN_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy

  queue:
    <<: [*php, *php-cli]
    command: php artisan queue:work --tries=3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    <<: [*php, *php-cli]
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  # Outil one-shot : composer, artisan, pest, pint...
  # Usage : docker compose run --rm tools php artisan migrate
  tools:
    <<: [*php, *php-cli]
    profiles: ["tools"]

  node:
    image: node:22-alpine
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-crm}
      POSTGRES_USER: ${DB_USERNAME:-crm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-crm} -d ${DB_DATABASE:-crm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # interface web
      - "1025:1025"   # SMTP

volumes:
  db-data: